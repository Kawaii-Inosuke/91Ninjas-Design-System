[project]
name = "studio-agents"
version = "0.1.0"
description = "91 Studio agent sidecar: AI design agents, renderer, layered SVG"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "jinja2>=3.1.6",
    "mcp>=2.3,<3",
    "playwright>=1.48",
    "pydantic>=2.14.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.uv]
package = false
